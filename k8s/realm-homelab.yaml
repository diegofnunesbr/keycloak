apiVersion: v1
kind: ConfigMap
metadata:
  name: realm-homelab
  namespace: keycloak
data:
  homelab-realm.json: |
    {
      "realm": "homelab",
      "displayName": "Homelab",
      "enabled": true,
      "sslRequired": "external",
      "registrationAllowed": false,
      "resetPasswordAllowed": false,
      "loginWithEmailAllowed": true,
      "bruteForceProtected": true,
      "groups": [
        { "name": "argocd-admins" }
      ],
      "users": [
        {
          "username": "diegofnunesbr",
          "firstName": "Diego",
          "lastName": "Nunes",
          "enabled": true,
          "groups": ["/argocd-admins"]
        }
      ],
      "clients": [
        {
          "clientId": "argocd",
          "name": "Argo CD",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "implicitFlowEnabled": false,
          "rootUrl": "https://argocd.diegofnunesbr.com",
          "baseUrl": "/applications",
          "redirectUris": [
            "https://argocd.diegofnunesbr.com/auth/callback",
            "http://localhost:8085/auth/callback"
          ],
          "webOrigins": ["https://argocd.diegofnunesbr.com"],
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "post.logout.redirect.uris": "https://argocd.diegofnunesbr.com/*"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "false",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups"
              }
            }
          ]
        }
      ]
    }
